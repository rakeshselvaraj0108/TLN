version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trace-x-postgres
    environment:
      POSTGRES_DB: trace_x
      POSTGRES_USER: trace_x
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace_x_secure_2026}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace_x -d trace_x"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trace-x-network

  neo4j:
    image: neo4j:5.20-community
    container_name: trace-x-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-trace_x_neo4j_2026}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - ./backend/neo4migrations:/docker-entrypoint-initdb.d
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-trace_x_neo4j_2026}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - trace-x-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trace-x-api
    environment:
      DATABASE_URL: postgresql+psycopg://trace_x:${POSTGRES_PASSWORD:-trace_x_secure_2026}@postgres:5432/trace_x
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-trace_x_neo4j_2026}
      SECRET_KEY: ${SECRET_KEY:-trace_x_secret_key_2026_change_in_production}
      TRACEX_DEMO_MODE: "true"
      TRACEX_LOG_LEVEL: INFO
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./benchmarks:/app/benchmarks
    networks:
      - trace-x-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trace-x-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - ./shared:/app/shared
    networks:
      - trace-x-network
    command: pnpm dev

  caddy:
    image: caddy:2-alpine
    container_name: trace-x-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - trace-x-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  caddy_data:
  caddy_config:

networks:
  trace-x-network:
    driver: bridge